<div class="create-user-container">

  <section class="title-section">
    <h1 class="main-title">CREAR USUARIO</h1>
  </section>

  <section class="form-container">

    <section class="form-section">
      <input class="form-input" name="name" type="text" placeholder="Elija un nombre">
      <input class="form-input" name="e-mail" type="email" placeholder="Elija un e-mail">
      <input class="form-input" name="password" type="password" placeholder="Elija una contraseña">
    </section>


    <section class="init-button-section">
      <button class="btn btn-primary" (click)="goToLoginPage()">
        CREAR
      </button>
      <button class="btn btn-secondary" (click)="goToLoginPage()">
        SALIR
      </button>
    </section>

  </section>

</div>
