    <!-- For de jugadores para renderizar los peones de cada jugador con su color-->
      @if (game | async; as game) {
        @for (player of game.players; track player.id) {
              <img class="pieces" alt="pieces" [src]="gamePiecesSvg[player.color]" [ngStyle]="getPiecePosition(player.position)"/>
            }
      }
