<div class="lobby-container">

  <section class="title-section">
    <h1 class="main-title">LOBBY</h1>
    <p class="secondary-tittle">Seleccione los parámetros de la partida</p>
  </section>

  <section class="configuration-section">
    <section class="player-size-section">
      <label>Seleccione el color de su ficha</label>

      <div class="players-list">

        <div class="player-card user-player">
          <select class="player-select" disabled>
            <option selected>Jugador</option>
          </select>

          <select class="player-colour">
            <option selected>Al azar</option>
            <option>Rojo</option>
            <option>Azul</option>
            <option>Amarillo</option>
            <option>Verde</option>
            <option>Blanco</option>
            <option>Negro</option>
          </select>

          <input type="checkbox">
        </div>

        <label>Añada los jugadores que desee a la partida (mínimo 2 y máximo 6)</label>

        <div class="player-card slot-player" *ngFor="let slot of playerSlots; let i = index" [hidden]="i === 0">

          <select [(ngModel)]="slot.type" class="bot-select">
            <option value="CLOSED" selected>Cerrado</option>
            <option value="BOT">Bot</option>
            <option value="HUMAN">Humano</option>
          </select>

          <select [(ngModel)]="slot.difficulty" class="difficulty-select" [disabled]="slot.type !== 'BOT'">
            <option value="EASY">Fácil</option>
            <option value="MEDIUM">Medio</option>
            <option value="HARD">Difícil</option>
          </select>

          <input type="checkbox">
        </div>

      </div>
    </section>
  </section>

  <section class="game-section">
    <button class="btn btn-primary" (click)="startGame()">
      COMENZAR PARTIDA
    </button>
    <button class="btn btn-secondary" (click)="goToMenuPage()">
      VOLVER ATRÁS
    </button>
  </section>

</div>
